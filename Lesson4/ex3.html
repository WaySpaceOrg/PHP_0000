<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องคิด BMI</title>
    <!-- นำเข้า Bootstrap CSS เพื่อความสวยงามเหมือนหน้า index -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    
    <!-- ส่วนเมนูนำทาง (Navigation Menu) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="../index.html">หน้าแรก (Home)</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="ex3.html">บทเรียนก่อนหน้า (Ex 3)</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="#">เครื่องคิด BMI</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="ex5.html">บทเรียนถัดไป (Ex 5)</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- เนื้อหาหลักของเครื่องคิด BMI -->
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm p-4">
                    <h1 class="h3 mb-4 text-center text-primary">เครื่องคิด BMI</h1>
                    
                    <div class="mb-3">
                        <label for="weight" class="form-label">น้ำหนัก (กก.)</label>
                        <input type="text" id="weight" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="height" class="form-label">ส่วนสูง (ซม.)</label>
                        <input type="text" id="height" class="form-control">
                    </div>

                    <button id="calc" class="btn btn-primary w-100 mb-3">คำนวณ</button>
                    
                    <div id="result" class="alert alert-info text-center fs-5 fw-bold" role="alert"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // เมื่อกดปุ่ม: อ่านค่า → คำนวณ → แสดงผลใน #result (รักษาลจิกเดิมของโจทย์ไว้ทุกประการ)
        document.getElementById("calc").addEventListener("click", function () {
            const weight = Number(document.getElementById("weight").value);
            const height = Number(document.getElementById("height").value) / 100; // แปลงเป็นเมตร
            const bmi = weight / (height * height);
            let bmitext = "";
            if(bmi<18.5){
                bmitext="น้ำหนักน้อย";
            }else if(bmi<25){
                bmitext="ปกติ";
            }else {
                bmitext="น้ำหนักเกิน";
            }
            if(isNaN(bmi) || weight <= 0 || height <= 0){
                document.getElementById("result").textContent = "กรุณากรอกน้ำหนักและส่วนสูง";
            } else {
                document.getElementById("result").textContent = "BMI " + bmi.toFixed(1) + " (" + bmitext + ")";
            }
        });
    </script>
</body>
</html>
