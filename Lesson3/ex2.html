<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>คำนวณราคารวม | Lesson 3</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:30px 16px;font-family:Tahoma,"Segoe UI",sans-serif;color:#51465a;background:linear-gradient(135deg,#eff9ff,#f5f1ff,#fff4f8);min-height:100vh}.card{max-width:620px;margin:auto;padding:clamp(24px,5vw,40px);background:white;border-radius:26px;box-shadow:0 18px 50px #718aa018}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.tag{background:#edf7ff;color:#6486a4;padding:8px 13px;border-radius:30px;font-size:13px;font-weight:bold}a{color:#7f82a3;text-decoration:none;font-size:14px}h1{color:#647e9c;margin:22px 0 8px;font-size:clamp(28px,5vw,38px)}p{color:#887e91;line-height:1.7}.product{display:flex;justify-content:space-between;align-items:center;padding:18px;background:#f2f8ff;border-radius:17px;margin:22px 0}.product strong{color:#587b9a}.price{font-size:23px;font-weight:bold;color:#6486a4}label{display:block;font-weight:bold;margin:18px 0 8px}input{width:100%;padding:14px;border:1px solid #e2e9f0;border-radius:12px;font:inherit}button{width:100%;padding:14px;border:0;border-radius:13px;background:#cfe7f7;color:#526f88;font:inherit;font-weight:bold;margin-top:18px;cursor:pointer}.total{margin-top:20px;padding:20px;background:#f5f1ff;border-radius:16px;text-align:center}.total small{color:#887e91}.total strong{display:block;font-size:30px;color:#806b9b;margin-top:7px}.error{color:#b34c70;font-size:14px;min-height:20px}
</style></head><body><main class="card"><div class="top"><span class="tag">LESSON 3 · แบบฝึกหัด 02</span><a href="index.html">← กลับหน้าบทเรียน</a></div>
<h1>คำนวณราคารวม</h1><p>ทดลองคำนวณราคาสินค้าจากราคาต่อชิ้นและจำนวนที่ต้องการซื้อ</p>
<div class="product"><div><strong>☕ ลาเต้เย็น</strong><p style="margin:5px 0 0">ราคาต่อแก้ว</p></div><span class="price">45 บาท</span></div>
<label for="qty">จำนวนแก้ว</label><input id="qty" type="number" min="1" max="99" value="3" step="1">
<button id="calculate" type="button">คำนวณราคา</button>
<div class="total"><small>ยอดรวมทั้งหมด</small><strong id="total">135 บาท</strong></div><p class="error" id="error" aria-live="polite"></p>
<a href="../index.html" style="display:inline-block;margin-top:20px">← กลับหน้าหลัก</a></main>
<script>
const price = 45;
const qtyInput = document.getElementById("qty");
const totalDisplay = document.getElementById("total");
const error = document.getElementById("error");
function calculateTotal(){
 const qty = Number(qtyInput.value);
 if(!Number.isInteger(qty) || qty < 1 || qty > 99){
  error.textContent = "กรุณากรอกจำนวนตั้งแต่ 1 ถึง 99 แก้ว";
  totalDisplay.textContent = "—";
  return;
 }
 error.textContent = "";
 const total = price * qty;
 totalDisplay.textContent = total.toLocaleString("th-TH") + " บาท";
}
document.getElementById("calculate").addEventListener("click",calculateTotal);
qtyInput.addEventListener("input",calculateTotal);
calculateTotal();
</script></body></html>
