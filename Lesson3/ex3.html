<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ปุ่มกดถูกใจ | Lesson 3</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;font-family:Tahoma,"Segoe UI",sans-serif;color:#51465a;background:linear-gradient(135deg,#fff0f6,#f4f0ff)}.card{width:min(600px,100%);padding:clamp(25px,5vw,42px);background:white;border-radius:27px;box-shadow:0 18px 50px #9b789718;text-align:center}.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;text-align:left}.tag{padding:8px 12px;border-radius:30px;background:#fff0f6;color:#a65d83;font-size:13px;font-weight:bold}a{color:#92718e;text-decoration:none;font-size:14px}h1{color:#765b7c;font-size:clamp(28px,5vw,38px);margin:26px 0 8px}.desc{color:#887e91;line-height:1.7}.heart{font-size:75px;margin:20px}.count{font-size:45px;font-weight:bold;color:#bd7096}.count-label{color:#887e91}button{padding:14px 26px;border:0;border-radius:30px;background:#f6d7e5;color:#925c79;font-size:17px;font-weight:bold;cursor:pointer;transition:.2s}button:hover{transform:scale(1.04)}button.liked{background:#e9ddfa;color:#78629a}.status{min-height:24px;color:#987c9a;margin-top:16px;font-size:14px}
</style></head><body><main class="card"><div class="top"><span class="tag">LESSON 3 · แบบฝึกหัด 03</span><a href="index.html">← กลับหน้าบทเรียน</a></div>
<h1>ปุ่มกดถูกใจ</h1><p class="desc">กดปุ่มหัวใจเพื่อเพิ่มจำนวนการกดถูกใจ และทดลองกดอีกครั้งเพื่อยกเลิก</p>
<div class="heart" aria-hidden="true">💗</div><div class="count" id="count" aria-live="polite">0</div><div class="count-label">ยอดถูกใจ</div>
<button id="like" type="button" aria-pressed="false">♡ ถูกใจ</button><p class="status" id="status" aria-live="polite">มาเป็นคนแรกที่กดถูกใจกันเถอะ!</p>
<a href="../index.html" style="display:inline-block;margin-top:15px">← กลับหน้าหลัก</a></main>
<script>
let likes = 0;
let isLiked = false;
const button = document.getElementById("like");
const count = document.getElementById("count");
const status = document.getElementById("status");
button.addEventListener("click",function(){
 if(isLiked){likes--;isLiked=false;}else{likes++;isLiked=true;}
 count.textContent = likes;
 button.textContent = isLiked ? "♥ ถูกใจแล้ว" : "♡ ถูกใจ";
 button.classList.toggle("liked",isLiked);
 button.setAttribute("aria-pressed",String(isLiked));
 status.textContent = likes >= 10 ? "ยอดนิยมแล้ว! ขอบคุณทุกกำลังใจ 💖" : (isLiked ? "ขอบคุณสำหรับการกดถูกใจ!" : "ยกเลิกการกดถูกใจแล้ว");
});
</script></body></html>
